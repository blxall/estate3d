<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Estate3D editorial development background</title>
  <desc id="desc">Warm editorial 3D architectural scene with layered residential towers, interior gallery floor, sunset window light, and soft paper texture.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="0.45" stop-color="#f0e6d7"/>
      <stop offset="1" stop-color="#b98a78"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f9efe3"/>
      <stop offset="0.38" stop-color="#e4b69a"/>
      <stop offset="0.72" stop-color="#8f4037"/>
      <stop offset="1" stop-color="#3d1410"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff9ef" stop-opacity="0.88"/>
      <stop offset="0.5" stop-color="#c59380" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#4a0a05" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="towerSide" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f8ead6"/>
      <stop offset="1" stop-color="#7e2d25"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f8f2e8"/>
      <stop offset="1" stop-color="#c6a192"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.085"/></feComponentTransfer>
      <feBlend mode="multiply" in2="SourceGraphic"/>
    </filter>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" fill="none" stroke="#4a0a05" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1800" height="1200" fill="url(#paper)"/>
  <rect width="1800" height="1200" fill="url(#sky)" opacity="0.82"/>
  <circle cx="1380" cy="260" r="260" fill="#fff1d8" opacity="0.46" filter="url(#soft)"/>
  <circle cx="420" cy="990" r="420" fill="#f6dcc2" opacity="0.38" filter="url(#soft)"/>

  <!-- editorial gallery architecture frame -->
  <path d="M0 840 C360 720 720 690 1080 760 C1320 807 1560 790 1800 690 L1800 1200 L0 1200 Z" fill="#f7eee3" opacity="0.78"/>
  <path d="M0 960 C450 860 820 850 1180 908 C1438 950 1625 920 1800 870 L1800 1200 L0 1200 Z" fill="#efe0d3" opacity="0.92"/>
  <path d="M175 1050 L1690 930 L1800 1200 L0 1200 Z" fill="url(#floor)" opacity="0.96"/>
  <path d="M0 1068 L1800 958" stroke="#4a0a05" stroke-opacity="0.13" stroke-width="3"/>
  <path d="M240 1200 L870 940 M620 1200 L1050 925 M1080 1200 L1280 922 M1510 1200 L1490 920" stroke="#4a0a05" stroke-opacity="0.11" stroke-width="2"/>

  <!-- large 3D residential model -->
  <g transform="translate(570 120)">
    <path d="M130 120 L470 20 L740 180 L410 310 Z" fill="#ffe8c6" opacity="0.72"/>
    <path d="M130 120 L410 310 L410 900 L130 718 Z" fill="url(#towerSide)"/>
    <path d="M410 310 L740 180 L740 760 L410 900 Z" fill="#5a1814" opacity="0.96"/>
    <path d="M130 120 L470 20 L470 600 L130 718 Z" fill="#f7dcc4" opacity="0.92"/>
    <path d="M470 20 L740 180 L740 760 L470 600 Z" fill="url(#glass)"/>

    <!-- floors -->
    <g stroke="#4a0a05" stroke-opacity="0.2" stroke-width="2">
      <path d="M130 190 L410 365 L740 235"/><path d="M130 250 L410 420 L740 290"/>
      <path d="M130 310 L410 475 L740 345"/><path d="M130 370 L410 530 L740 400"/>
      <path d="M130 430 L410 585 L740 455"/><path d="M130 490 L410 640 L740 510"/>
      <path d="M130 550 L410 695 L740 565"/><path d="M130 610 L410 750 L740 620"/>
      <path d="M130 670 L410 805 L740 675"/>
    </g>
    <g stroke="#fff7ed" stroke-opacity="0.5" stroke-width="1.4">
      <path d="M210 160 L210 770"/><path d="M290 130 L290 824"/><path d="M370 100 L370 875"/>
      <path d="M520 78 L520 808"/><path d="M605 130 L605 777"/><path d="M685 178 L685 744"/>
    </g>

    <!-- selected floor and apartment glow -->
    <path d="M130 490 L410 640 L740 510 L740 565 L410 695 L130 550 Z" fill="#fff0d5" opacity="0.72"/>
    <path d="M528 535 L670 478 L670 545 L528 606 Z" fill="#f7cab0" opacity="0.95"/>
    <path d="M528 535 L670 478 L670 545 L528 606 Z" fill="none" stroke="#fff9ef" stroke-width="5" stroke-opacity="0.78"/>
  </g>

  <!-- foreground interior objects -->
  <g opacity="0.82">
    <ellipse cx="388" cy="1016" rx="190" ry="42" fill="#4a0a05" opacity="0.09"/>
    <path d="M260 900 Q375 840 500 900 L475 1010 Q375 1065 285 1010 Z" fill="#f8f1e7" stroke="#4a0a05" stroke-opacity="0.2" stroke-width="2"/>
    <path d="M300 900 Q378 865 460 900" fill="none" stroke="#4a0a05" stroke-opacity="0.2" stroke-width="2"/>
    <rect x="1250" y="850" width="260" height="128" rx="4" fill="#f8f1e7" opacity="0.9" stroke="#4a0a05" stroke-opacity="0.18"/>
    <path d="M1288 904 H1475 M1288 938 H1428" stroke="#4a0a05" stroke-opacity="0.22" stroke-width="5"/>
  </g>

  <!-- warm editorial window columns -->
  <g opacity="0.24" stroke="#fff8ee" stroke-width="28">
    <path d="M122 0 V820"/><path d="M1670 0 V770"/><path d="M0 150 H1800"/>
  </g>
  <rect width="1800" height="1200" fill="url(#grid)" opacity="0.24"/>
  <rect width="1800" height="1200" filter="url(#grain)" opacity="0.55"/>
</svg>
